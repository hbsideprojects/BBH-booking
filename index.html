<style>

    --blush: #fff4ef;
    --yellow: #f2ee9e;
    --ink: #2b2b23;
    --ink-soft: #55523f;
    --line: rgba(43,43,35,0.35);
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--blush);
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .shape {
    position: absolute;
    z-index: 0;
    pointer-events: none;
  }

  .shape-topright {
    top: 0;
    right: 0;
    width: 760px;
    height: auto;
  }

  .shape-topleft {
    bottom: 0;
    right: -60px;
    width: 680px;
    height: auto;
}

.shape-bottomleft {
    top: 40px;
    left: -40px;
    width: 520px;
    height: auto;
}

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 24px 96px;
    text-align: center;
  }

  .logo {
    width: 180px;
    height: auto;
    display: block;
    margin: 0 auto 24px;
  }

  .script-heading {
    font-family: 'Beth Ellen', cursive;
    font-weight: 400;
    font-size: 30px;
    color: var(--ink);
    text-align: center;
    margin: 0 0 24px;
  }

  .booking-panel {
    background: var(--white);
    border: 1px solid var(--ink);
    border-radius: 0;
    padding: 0;
    min-height: 480px;
    overflow: hidden;
    text-align: left;
  }

  #booqable-embed {
    width: 100%;
    min-height: 480px;
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
  }

  .embed-placeholder {
    padding: 48px 32px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 15px;
  }

  #booqable-embed .booqable-product-list {
    font-family: 'Work Sans', sans-serif;
    padding: 24px;
  }

  #booqable-embed .header-search {
    display: none !important;
  }

  #booqable-embed .collection-page__items {
    max-width: 900px !important;
    margin-left: auto !important;
    margin-right: auto !important;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) !important;
    justify-content: center !important;
  }

  #booqable-embed .booqable-product-list,
  #booqable-embed .booqable-product-list * {
    font-family: 'Work Sans', sans-serif !important;
  }

  #booqable-embed .booqable-product-list {
    font-size: 15px !important;
    color: var(--ink) !important;
  }

  #booqable-embed .booqable-datepicker {
    padding: 20px 24px 0;
  }

  #booqable-embed .bq-date-picker-button-wrapper {
    background: var(--ink) !important;
    color: #ffffff !important;
    border-radius: 4px !important;
    border: none !important;
  }

  #booqable-embed .bq-date-picker-button-text {
    color: #ffffff !important;
  }

  #booqable-embed .booqable-product-list-notice {
    display: none !important;
  }
  
  #booqable-embed .bq-button.bq-branded {
    display: none !important;
}

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  footer a { color: var(--ink-soft); }

  @media (max-width: 480px) {
    .script-heading { font-size: 24px; }
    .shape-topright { width: 220px; }
    .shape-topleft { width: 200px; top: 20px; left: -40px; }

<img src="shape-topright.png" alt="" class="shape shape-topright">
<img src="shape-bottomleft.png" alt="" class="shape shape-bottomleft">

<div class="wrap">

  <div class="script-heading">Hire a bike box today</div>

      <div class="booqable-datepicker"></div>

    </div>
  </div>

  <footer>
    <a href="https://bikeboxhire.io">&larr; Back to BikeBoxHire.io</a>
  </footer>
</div>

<script>
  function updateButtonText() {
    document.querySelectorAll('.bq-date-picker-button-text').forEach(function (el) {
      if (el.textContent.trim() !== 'Check hire period and prices') {
        el.textContent = 'Check hire period and prices';
      }
    });
  }
  var observer = new MutationObserver(updateButtonText);
  observer.observe(document.body, { childList: true, subtree: true, characterData: true });
  updateButtonText();
</script>
